services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ucw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ucw_app}
      POSTGRES_USER: ${DB_USERNAME:-ucw_app}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    # Internal Docker network only. For local host access, use a dev-only compose override.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ucw-network

  # Redis for caching and queue
  redis:
    image: redis:7-alpine
    container_name: ucw-redis
    restart: unless-stopped
    # Internal Docker network only. For local host access, use a dev-only compose override.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - ucw-network

  # Laravel Application
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ucw-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ucw_app}
      DB_USERNAME: ${DB_USERNAME:-ucw_app}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-pakasir}
      PAKASIR_PROJECT: "${PAKASIR_PROJECT:?Set PAKASIR_PROJECT in .env}"
      PAKASIR_API_KEY: "${PAKASIR_API_KEY:?Set PAKASIR_API_KEY in .env}"
      PAKASIR_MODE: ${PAKASIR_MODE:-production}
      PAKASIR_BASE_URL: ${PAKASIR_BASE_URL:-https://app.pakasir.com}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      REVERB_APP_ID: ${REVERB_APP_ID:-ucw-reverb}
      REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}"
      REVERB_HOST: ${REVERB_HOST:-localhost}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
    command: php-fpm
    depends_on:
      - postgres
      - redis
    networks:
      - ucw-network

  # Nginx Web Server
  nginx:
    image: nginx:1.25-alpine
    container_name: ucw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl/:/etc/nginx/ssl/
    depends_on:
      - app
    networks:
      - ucw-network

  # Node.js for frontend
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ucw-node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      NODE_ENV: development
    command: npm run dev -- --host 0.0.0.0
    profiles:
      - dev
    ports:
      - "5173:5173"
    depends_on:
      - app
    networks:
      - ucw-network

  # Laravel Reverb (WebSocket)
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ucw-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ucw_app}
      DB_USERNAME: ${DB_USERNAME:-ucw_app}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID:-ucw-reverb}
      REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}"
      REVERB_HOST: ${REVERB_HOST:-localhost}
      REVERB_PORT: ${REVERB_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - app
      - redis
    networks:
      - ucw-network

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ucw-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ucw_app}
      DB_USERNAME: ${DB_USERNAME:-ucw_app}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    depends_on:
      - app
      - redis
    networks:
      - ucw-network

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ucw-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ucw_app}
      DB_USERNAME: ${DB_USERNAME:-ucw_app}
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: |
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    depends_on:
      - app
    networks:
      - ucw-network

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ucw-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    profiles:
      - dev
    networks:
      - ucw-network

  # FastAPI AI Service
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: ucw-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./ai_service:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${APP_ENV:-production}
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - ucw-network

volumes:
  postgres_data:
  redis_data:
  node_modules:

networks:
  ucw-network:
    driver: bridge
